name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"

permissions:
  security-events: write
  packages: read
  contents: read

jobs:
  analyze:
    name: Analyze Swift
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: swift
            build-mode: manual

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned XcodeGen
        env:
          XCODEGEN_VERSION: "2.46.0"
          XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
        run: |
          archive="$RUNNER_TEMP/xcodegen.zip"
          curl --fail --location --silent --show-error \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip" \
            --output "$archive"
          echo "${XCODEGEN_SHA256}  ${archive}" | shasum -a 256 --check
          unzip -q "$archive" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Generate project
        run: xcodegen generate

      - name: Prebuild dependencies before CodeQL
        run: |
          xcodebuild build \
            -project Talkie.xcodeproj \
            -scheme Talkie \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/TalkieCodeQLDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            APP_SHORTCUTS_ENABLE_FLEXIBLE_MATCHING=NO \
            SWIFT_ENABLE_EXPLICIT_MODULES=NO \
            CLANG_ENABLE_EXPLICIT_MODULES=NO
          find Talkie -type f -name '*.swift' -exec touch {} +

      - name: Initialize CodeQL
        uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Build for CodeQL
        run: |
          xcodebuild build \
            -project Talkie.xcodeproj \
            -scheme Talkie \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/TalkieCodeQLDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            APP_SHORTCUTS_ENABLE_FLEXIBLE_MATCHING=NO \
            SWIFT_ENABLE_EXPLICIT_MODULES=NO \
            CLANG_ENABLE_EXPLICIT_MODULES=NO

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
